# h1n054ur starship prompt
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 1000

format = """
[┌─\\[](bold green)$username[@](dimmed white)$hostname[\\]](bold green)$directory$git_branch$git_commit$git_state$git_status$nodejs$bun$python$golang$rust$ruby$docker_context$cmd_duration
[└─](bold green)$character"""

right_format = "$time"

[username]
show_always = true
style_user = "bold bright-white"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold cyan"
format = "[$hostname]($style)"

[directory]
style = "bold bright-cyan"
read_only = " 󰌾"
truncation_length = 4
truncate_to_repo = true
format = " [ $path]($style)[$read_only]($read_only_style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[git_branch]
symbol = " "
style = "bold purple"
format = " [$symbol$branch(:$remote_branch)]($style)"

[git_commit]
tag_symbol = "  "
style = "dimmed white"

[git_status]
style = "bold yellow"
format = "([ $all_status$ahead_behind]($style))"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
stashed = "*${count}"
conflicted = "=${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2000
style = "dimmed yellow"
format = " [ $duration]($style)"

[time]
disabled = false
style = "dimmed white"
format = "[$time]($style)"
time_format = "%H:%M"

[nodejs]
symbol = " "
style = "bold green"
format = " [$symbol($version)]($style)"

[bun]
symbol = "🥟 "
format = " [$symbol($version)]($style)"

[python]
symbol = " "
style = "bold yellow"
format = " [$symbol($version)(\\($virtualenv\\))]($style)"

[golang]
symbol = " "
style = "bold cyan"
format = " [$symbol($version)]($style)"

[rust]
symbol = " "
style = "bold red"
format = " [$symbol($version)]($style)"

[ruby]
symbol = " "
style = "bold red"
format = " [$symbol($version)]($style)"

[docker_context]
symbol = " "
format = " [$symbol$context]($style)"
